name: Validate SME F16F16

on:
  workflow_dispatch:
  push:
    branches:
      - validation/sme-f16f16

permissions:
  contents: read

jobs:
  qemu-sme-f16f16:
    runs-on: ubuntu-24.04
    container: debian:sid
    steps:
      - name: Install cross compiler and QEMU
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gcc gcc-aarch64-linux-gnu git libc6-dev-arm64-cross qemu-user
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Report emulation toolchain
        run: |
          qemu-aarch64 --version
          aarch64-linux-gnu-gcc --version
          rustc -vV
      - name: Probe the emulated SME runtime
        run: |
          aarch64-linux-gnu-gcc -O2 .github/validation/sme_runtime_probe.c -o /tmp/sme-runtime-probe
          set +e
          qemu-aarch64 -cpu max,sme512=on -L /usr/aarch64-linux-gnu /tmp/sme-runtime-probe
          exact_status=$?
          set -e
          echo "exact_pr_command_status=${exact_status}"
          qemu-aarch64 -cpu max,sme512=on,sme-default-vector-length=64 -L /usr/aarch64-linux-gnu /tmp/sme-runtime-probe
      - name: Run tract SME tests under QEMU
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu max,sme512=on,sme-default-vector-length=64 -L /usr/aarch64-linux-gnu
        run: cargo test -p tract-linalg --target aarch64-unknown-linux-gnu arm64::sme -- --nocapture

  windows-arm64:
    if: ${{ !contains(github.event.head_commit.message, '[qemu-only]') }}
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report Windows ARM64 hardware
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name,Manufacturer,Architecture,NumberOfCores,NumberOfLogicalProcessors
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture
          clang --version
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Check tract-linalg
        run: cargo check -p tract-linalg -vv
      - name: Compile tract-linalg tests
        run: cargo test -p tract-linalg --no-run
